  body { margin: 0; background: ${x.bg}; color: ${x.text}; font-family: Arial, Helvetica, sans-serif; font-size: 13px; }
  .page { width: 210mm; min-height: 297mm; padding: 13mm 18mm; page-break-after: always; break-after: page; overflow: hidden; background: ${x.bg}; display: flex; flex-direction: column; gap: 12px; }
  .page-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  header { border-bottom: 4px solid ${x.accent}; padding-bottom: 12px; display: flex; justify-content: space-between; align-items: end; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo svg { height: 84px; width: auto; display: block; }
  .page-header-mini { border-bottom: 4px solid ${x.accent}; padding-bottom: 12px; display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 34px; margin: 0; font-weight: 900; font-style: italic; letter-spacing: -1px; white-space: nowrap; }
  h2 { font-size: 24px; margin: 0 0 10px; font-weight: 900; text-transform: uppercase; color: ${x.accent}; }
  h3 { font-size: 13px; margin: 0 0 6px; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid ${x.borde}; padding-bottom: 4px; }
  p { margin: 0 0 12px; line-height: 1.65; }
  .muted { color: ${x.muted}; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .box { border: 1px solid ${x.borde}; padding: 16px; border-radius: 8px; break-inside: avoid; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  li { display: flex; gap: 9px; align-items: center; }
  .check { width: 17px; height: 17px; border: 1px solid ${x.accent}; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; flex: 0 0 auto; color: ${x.accent}; }
  .map-frame { border: 1px solid ${x.borde}; padding: 6mm; display: flex; justify-content: center; background: ${x.mapBg}; }
  .map-frame svg { width: 100%; height: auto; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid ${x.borde}; padding: 12px; text-align: left; }
  th { background: ${x.th}; font-weight: 900; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cot td.cur, .cot th.cur { background: ${x.th}; color: ${x.accent}; font-weight: 900; }
  .cot tr.tot td { font-weight: 900; color: ${x.total}; font-size: 13px; }
  .note { font-size: 11px; color: ${x.muted}; margin-top: 6px; }
  /* Los textos de antecedentes son editables por el usuario; sin tope, un texto largo
     empuja el checklist fuera del A4 y overflow:hidden lo recorta en silencio. */
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
  /* Datos operativos del evento: lo primero que busca produccion en un rider. */
  .info-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .info-cell { border: 1px solid ${x.borde}; border-left: 4px solid ${x.accent}; border-radius: 6px; padding: 10px 12px; }
  .info-cell span { display: block; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.14em; color: ${x.muted}; margin-bottom: 4px; }
  .info-cell strong { font-size: 14px; }
  /* Los estilos .contacts/.fill se retiraron junto con el bloque de contactos. */
</style>
