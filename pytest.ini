[pytest]
# Anchors this repository as its own pytest rootdir. Without it, pytest walks
# up past the checkout and adopts an unrelated parent configuration: a marker
# filter there deselects every test here and exits 5, so the documented
# commands report nothing rather than running.
#
# Only `tests/` is collected. The suites under xio/new-plugins/showcontrol/
# are standalone scripts: they insert their own directory on sys.path and
# import siblings flat, which pytest breaks by importing them as part of the
# showcontrol package -- that package's __init__ needs plugins.base from
# xio/new/. Run those with the interpreter directly, as the README shows.
testpaths = tests
